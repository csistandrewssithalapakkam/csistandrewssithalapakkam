<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Andrew's church TNHB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary-blue': '#0ea5e9', /* sky-500 */
            'accent-blue': '#38bdf8', /* sky-400 */
            'light-blue-bg': '#f0f9ff', /* sky-50 */
            'dark-blue-bg': '#0c4a6e', /* sky-900 */
            'warm-gold': '#B48A5E',
          },
          fontFamily: {
            'sans': ['Inter', 'sans-serif'],
            'serif': ['Lora', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    /* Custom styles for animations */
    @keyframes zoom-out {
      from {
        transform: scale(1.1);
      }
      to {
        transform: scale(1);
      }
    }
    .animate-zoom-out {
      animation: zoom-out 8s linear forwards;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.5s ease-out forwards;
    }

    /* Ribbon Cutting Animations */
    @keyframes scissor-cut-left {
      0% { transform: rotate(15deg); }
      50% { transform: rotate(-25deg); }
      100% { transform: rotate(-25deg); }
    }
    @keyframes scissor-cut-right {
      0% { transform: rotate(-15deg); }
      50% { transform: rotate(25deg); }
      100% { transform: rotate(25deg); }
    }
    @keyframes ribbon-fall {
      0% { transform: translateY(0) scaleY(1); opacity: 1; }
      100% { transform: translateY(100vh) scaleY(0); opacity: 0; }
    }
    .animate-scissor-cut-left {
      animation: scissor-cut-left 1s ease-in-out forwards;
    }
    .animate-scissor-cut-right {
      animation: scissor-cut-right 1s ease-in-out forwards;
    }
    .animate-ribbon-fall {
      animation: ribbon-fall 1s ease-in forwards;
      animation-delay: 500ms; /* Start falling halfway through the cut */
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "rxjs": "https://aistudiocdn.com/rxjs@^7.8.2?conditions=es2015",
    "rxjs/operators": "https://aistudiocdn.com/rxjs@^7.8.2/operators?conditions=es2015",
    "rxjs/ajax": "https://aistudiocdn.com/rxjs@^7.8.2/ajax?conditions=es2015",
    "rxjs/webSocket": "https://aistudiocdn.com/rxjs@^7.8.2/webSocket?conditions=es2015",
    "rxjs/testing": "https://aistudiocdn.com/rxjs@^7.8.2/testing?conditions=es2015",
    "rxjs/fetch": "https://aistudiocdn.com/rxjs@^7.8.2/fetch?conditions=es2015",
    "@angular/compiler": "https://next.esm.sh/@angular/compiler@^20.3.10?external=rxjs",
    "@angular/platform-browser": "https://next.esm.sh/@angular/platform-browser@^20.3.10?external=rxjs",
    "@angular/core": "https://next.esm.sh/@angular/core@^20.3.10?external=rxjs",
    "@angular/common": "https://next.esm.sh/@angular/common@^20.3.10?external=rxjs",
    "@angular/router": "https://next.esm.sh/@angular/router@^20.3.10?external=rxjs",
    "@angular/forms": "https://next.esm.sh/@angular/forms@^20.3.10?external=rxjs"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-light-blue-bg font-sans text-black">
  <app-root></app-root>
</body>
</html>
