<app-header></app-header>
<main>
  <section id="forms-page" class="py-20 bg-white pt-32">
    <div class="container mx-auto px-6">
      <div class="flex justify-between items-center mb-12">
        <div class="text-left">
          <h2 class="text-4xl font-bold font-serif text-black">Applications</h2>
          <p class="mt-2 text-black">Find important church forms and documents here.</p>
        </div>
        <a routerLink="/" class="bg-gray-200 text-black font-bold py-2 px-6 rounded-full hover:bg-gray-300 transition-colors duration-300 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Back to Home
        </a>
      </div>

      <div class="max-w-4xl mx-auto space-y-6">
        @for(form of forms(); track form.title) {
          <div class="bg-light-blue-bg border border-gray-200 rounded-lg p-6 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
            <div class="flex-grow">
              <h3 class="text-xl font-bold text-black font-serif">{{ form.title }}</h3>
              <p class="text-black mt-2">{{ form.description }}</p>
            </div>
            <a [href]="form.downloadUrl" download class="bg-primary-blue text-white font-bold py-2 px-6 rounded-full hover:bg-accent-blue transition-colors duration-300 flex items-center gap-2 flex-shrink-0 self-start sm:self-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
              Download
            </a>
          </div>
        } @empty {
          <div class="text-center py-12 px-4 border-2 border-dashed rounded-lg">
            <p class="text-gray-500">No forms are available for download at this time.</p>
          </div>
        }
      </div>

    </div>
  </section>
</main>
<app-footer></app-footer>
