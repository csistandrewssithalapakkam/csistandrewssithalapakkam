<!-- Upcoming Events Section -->
<section id="events" class="py-20 bg-white">
  <div class="container mx-auto px-6 text-center">
    <h2 class="text-4xl font-bold font-serif text-black">
      Upcoming Events
    </h2>
    <p class="mt-2 text-black">
      Get involved and connect with our community.
    </p>
    <div class="mt-12 grid md:grid-cols-3 gap-8">
      @for (event of upcomingEvents; track event.title) {
      <div class="bg-white rounded-lg shadow-lg overflow-hidden text-left group transition-all duration-300 hover:shadow-2xl hover:-translate-y-2">
        <div class="overflow-hidden">
           <img
            [ngSrc]="event.image"
            alt="{{ event.title }}"
            class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-300"
            width="600"
            height="400"
          />
        </div>
        <div class="p-6">
          <h3 class="text-xl font-bold text-black">{{ event.title }}</h3>
          <p class="mt-1 font-semibold text-black">{{ event.date }}</p>
          <p class="mt-3 text-black">{{ event.description }}</p>
        </div>
      </div>
      }
    </div>
  </div>
</section>
