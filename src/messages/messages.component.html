<!-- Recent Messages Section -->
<section id="messages" class="py-20 bg-light-blue-bg">
  <div class="container mx-auto px-6 text-center">
    <h2 class="text-4xl font-bold font-serif text-black">
      Recent Messages
    </h2>
    <p class="mt-2 text-black">
      Catch up on our latest sermons and teachings.
    </p>
    <div class="mt-12 space-y-8 max-w-4xl mx-auto">
      @for (message of recentMessages; track message.title) {
      <div class="bg-white rounded-lg shadow-lg overflow-hidden text-left group transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 flex flex-col md:flex-row md:items-center">
        <!-- Content Left (Desktop) / Bottom (Mobile) -->
        <div class="p-6 md:p-8 flex-grow flex flex-col justify-center order-2 md:order-1">
          <h3
            class="text-xl font-bold text-black group-hover:text-accent-blue transition-colors"
          >
            {{ message.title }}
          </h3>
          <p class="mt-1 text-black">{{ message.author }}</p>
        </div>
        <!-- Image Right (Desktop) / Top (Mobile) -->
        <div class="md:w-1/3 flex-shrink-0 h-48 md:h-auto order-1 md:order-2">
          <img
            [src]="message.image"
            alt="{{ message.title }}"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
          />
        </div>
      </div>
      }
    </div>
  </div>
</section>
