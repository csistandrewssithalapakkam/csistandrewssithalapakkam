<section class="daily-verse d-flex align-items-center justify-content-center py-5" style="background: linear-gradient(180deg, rgba(59,130,246,0.06), rgba(59,130,246,0.02));">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card shadow-sm text-center p-4">
          <div class="card-body">
            <h3 class="card-title mb-1">Daily Bible Verse</h3>
            <p class="text-muted small mb-3">{{ verse.ref }} — {{ dateStr }}</p>

            <div class="mb-3">
              <h5 class="mb-1">English</h5>
              <blockquote class="blockquote fst-italic mb-0">"{{ verse.english }}"</blockquote>
            </div>

            <div class="mt-3">
              <h5 class="mb-1">தமிழ்</h5>
              <blockquote class="blockquote fst-italic mb-0">"{{ verse.tamil }}"</blockquote>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
