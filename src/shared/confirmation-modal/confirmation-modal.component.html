<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in" (click)="onClose()">
  <div class="bg-white rounded-lg shadow-2xl w-full max-w-lg m-4" (click)="$event.stopPropagation()">
      <div class="p-6 border-b">
        <h3 class="text-xl font-bold font-serif text-gray-800">{{ title() }}</h3>
      </div>
      <div class="p-6">
        <p class="text-gray-700">{{ message() }}</p>
      </div>
      <div class="p-6 bg-gray-50 flex justify-end gap-3 rounded-b-lg">
        <button type="button" (click)="onClose()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition-colors">
          Cancel
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          class="px-4 py-2 bg-primary-blue text-white rounded-md hover:bg-accent-blue transition-colors"
        >
          Confirm
        </button>
      </div>
  </div>
</div>
