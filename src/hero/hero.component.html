<!-- Hero Section -->
<section
  id="home"
  class="relative h-[80vh] w-full flex items-center justify-center text-center text-white bg-black overflow-hidden"
>
  <!-- Background Image Slider -->
  @for (image of heroImages(); track image; let i = $index) {
  <div
    class="absolute inset-0 bg-cover bg-center transition-opacity duration-1000 ease-in-out"
    [style.background-image]="'url(' + image + ')'"
    [class.opacity-100]="currentHeroImageIndex() === i"
    [class.opacity-0]="currentHeroImageIndex() !== i"
    [class.animate-zoom-out]="currentHeroImageIndex() === i"
  ></div>
  }
  <div class="absolute inset-0 bg-black/50"></div>

  <!-- Slider Controls -->
  <button (click)="prevImage()" class="absolute left-4 top-1/2 -translate-y-1/2 z-20 p-2 rounded-full bg-black/30 hover:bg-black/50 transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
  </button>
  <button (click)="nextImage()" class="absolute right-4 top-1/2 -translate-y-1/2 z-20 p-2 rounded-full bg-black/30 hover:bg-black/50 transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
  </button>
  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-20 flex space-x-3">
    @for(image of heroImages(); track image; let i = $index) {
      <button (click)="selectImage(i)" class="w-3 h-3 rounded-full transition-all duration-300" [class.bg-white]="currentHeroImageIndex() === i" [class.bg-white/50]="currentHeroImageIndex() !== i" [class.scale-125]="currentHeroImageIndex() === i"></button>
    }
  </div>

  <!-- Sunday Service Info Box -->
  <div class="absolute bottom-8 right-8 z-20 bg-black/60 backdrop-blur-sm p-6 rounded-lg text-left max-w-sm shadow-lg">
    <h2 class="text-2xl font-bold font-serif text-white">Sunday Service</h2>
    <p class="mt-2 text-lg text-gray-200">Regular Service: Sundays at 8:30 AM</p>
    <p class="mt-1 text-base text-gray-300">Holy Communion (4th Sunday): 9:00 AM</p>
     <button (click)="scrollTo('visit', $event)" class="mt-4 bg-white text-primary-blue font-semibold py-2 px-6 rounded-full hover:bg-gray-200 transition-all shadow-md text-sm">
       Get Directions
     </button>
  </div>
</section>
