<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-sm" (click)="onClose()">
  <!-- Close Button -->
  <button (click)="onClose()" class="absolute top-4 right-4 text-white/70 hover:text-white transition-colors z-50" aria-label="Close image preview">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Image Container -->
  <div class="relative w-full h-full flex items-center justify-center p-4 md:p-8" (click)="$event.stopPropagation()">
    <!-- Main Image -->
    <div class="relative max-w-full max-h-full flex items-center justify-center">
       @if(images().length > 0) {
        <img [src]="images()[currentIndex()]" alt="Full screen gallery image" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl" />
       }
    </div>

    <!-- Navigation -->
    @if(images().length > 1) {
    <button (click)="prevImage(); $event.stopPropagation()" class="absolute left-2 md:left-4 top-1/2 -translate-y-1/2 z-50 p-3 rounded-full bg-black/30 hover:bg-black/50 transition-colors text-white" aria-label="Previous image">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
    </button>
    <button (click)="nextImage(); $event.stopPropagation()" class="absolute right-2 md:right-4 top-1/2 -translate-y-1/2 z-50 p-3 rounded-full bg-black/30 hover:bg-black/50 transition-colors text-white" aria-label="Next image">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
    </button>
    }
  </div>
</div>
