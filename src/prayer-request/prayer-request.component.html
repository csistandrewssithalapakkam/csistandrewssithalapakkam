<!-- Prayer Request -->
<section id="prayer" class="py-20 bg-gradient-to-br from-sky-50 to-gray-50">
  <div class="container mx-auto px-6 max-w-4xl">
    <div
      class="rounded-xl shadow-2xl p-10 text-center relative transition-colors duration-300 border"
      [class.bg-white]="!isDarkMode()"
      [class.border-gray-200]="!isDarkMode()"
      [class.bg-gray-800]="isDarkMode()"
      [class.border-gray-700]="isDarkMode()"
    >
      <button
        (click)="toggleTheme()"
        class="absolute top-6 right-6 text-gray-500 hover:text-primary-blue transition-colors"
        [class.text-gray-400]="isDarkMode()"
        [class.hover:text-white]="isDarkMode()"
        aria-label="Toggle dark mode"
      >
        @if(!isDarkMode()) {
        <!-- Moon Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
          />
        </svg>
        } @else {
        <!-- Sun Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
          />
        </svg>
        }
      </button>

      <h2
        class="text-4xl font-bold font-serif transition-colors duration-300"
        [class.text-black]="!isDarkMode()"
        [class.text-white]="isDarkMode()"
      >
        Prayer Request
      </h2>
      <p
        class="mt-2 transition-colors duration-300"
        [class.text-black]="!isDarkMode()"
        [class.text-gray-300]="isDarkMode()"
      >
        We would be honored to pray for you. How can we help?
      </p>
      <div class="mt-8">
        <textarea
          [value]="prayerRequest()"
          (input)="prayerRequest.set($any($event.target).value)"
          rows="6"
          placeholder="Share your prayer request here..."
          class="w-full p-4 border rounded-lg focus:ring-2 focus:ring-accent-blue focus:border-accent-blue transition-all duration-300"
          [class.bg-gray-50]="!isDarkMode()"
          [class.border-gray-300]="!isDarkMode()"
          [class.text-black]="!isDarkMode()"
          [class.bg-gray-900]="isDarkMode()"
          [class.border-gray-600]="isDarkMode()"
          [class.text-gray-200]="isDarkMode()"
          [class.placeholder-gray-500]="isDarkMode()"
        ></textarea>
        <button
          (click)="submitPrayerRequest()"
          class="mt-6 w-full font-bold py-4 px-8 rounded-full shadow-lg text-lg transition-all duration-300 transform hover:scale-105"
          [class.bg-primary-blue]="!isDarkMode()"
          [class.text-white]="!isDarkMode()"
          [class.hover:bg-accent-blue]="!isDarkMode()"
          [class.text-gray-200]="isDarkMode()"
          [class.bg-accent-blue]="isDarkMode()"
          [class.hover:bg-sky-300]="isDarkMode()"
          [class.hover:text-white]="isDarkMode()"
        >
          Submit Prayer Request
        </button>
      </div>
    </div>
  </div>
</section>
