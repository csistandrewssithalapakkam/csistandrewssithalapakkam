<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-sm" (click)="onClose()">
  <!-- Close Button -->
  <button (click)="onClose()" class="absolute top-4 right-4 text-white/70 hover:text-white transition-colors z-50" aria-label="Close video preview">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Video Container -->
  <div class="relative w-full max-w-4xl h-auto aspect-video p-4" (click)="$event.stopPropagation()">
    @if(sanitizedVideoUrl(); as url) {
      <iframe 
        [src]="url" 
        class="w-full h-full border-0 rounded-lg shadow-2xl" 
        allow="autoplay; encrypted-media" 
        allowfullscreen>
      </iframe>
    } @else {
      <div class="w-full h-full flex items-center justify-center bg-black rounded-lg">
        <p class="text-white">Invalid video URL.</p>
      </div>
    }
  </div>
</div>
